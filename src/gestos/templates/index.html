<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#181918">
  <title>Fusca Azul</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/controle.css') }}">
  <script type="module" src="{{ url_for('static', path='/controle.js') }}" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Fusca Azul</h1>
      <span id="connection" role="status">Conectando…</span>
    </header>

    <div class="viewport">
      <video id="webcam" autoplay playsinline muted aria-label="Câmera"></video>
      <canvas id="overlay" aria-hidden="true"></canvas>
      <div id="placeholder">
        <p id="placeholder-title">Câmera desligada</p>
        <p id="placeholder-text"></p>
      </div>
    </div>

    <div class="controls">
      <button id="camera-button" type="button">Ativar câmera</button>
      <label class="toggle">
        <input id="show-landmarks" type="checkbox" role="switch">
        <span class="switch" aria-hidden="true"></span>
        Pontos da mão
      </label>
    </div>

    <div class="mode-row" role="status"><span>Modo</span><strong id="mode-text">—</strong></div>

    <div id="command-card" data-state="idle" role="status">
      <span>Gesto</span>
      <strong id="command-text">—</strong>
    </div>
  </main>
</body>
</html>
