[project]
name = "gestos"
version = "0.1.0"
description = "Código identificador de gestos feito para o rewrite do treinee 2026/01 da ERUS"
readme = "README.md"
authors = [
    { name = "Dimitry Deveza", email = "dimydeveza@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mediapipe>=1.0.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "requests>=2.34.2",
]

[project.scripts]
gestos = "gestos:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
